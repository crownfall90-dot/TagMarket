# Выкладка сервера (бот, вебхук, Mini App) после зелёного CI на main —
# так же сама, как обновляются агенты на ПК. Выкладывает tools/deploy_cli.py:
# архив строго из FILES, на сервере tools/deploy_miniapp.py — тесты, снимок
# для отката и автоматический возврат прежнего кода при сбое. Если файлы
# сервера не менялись (правили документы или агента), сервисы не трогаются.
#
# Нужны секреты репозитория (Settings → Secrets and variables → Actions):
#   VPS_SSH_KEY     — закрытый ключ tagmarkets_vps, тот же, что у пульта;
#   VPS_KNOWN_HOSTS — строка сервера из known_hosts на ПК: сверка, что это
#                     наш сервер, а не подмена по дороге.
# Оба секрета обязательны: без любого из них выкладка останавливается с
# ошибкой (Deploy красный), а не пропускается тихо — иначе при настроенном CI
# сервер оставался бы на старой версии, а зелёный значок говорил обратное.
# Нормальный пропуск один: код сервера с прошлой выкладки не менялся (правили
# документы или агента) — в журнале это строка «Production code unchanged —
# deployment not required». Выкладывается ровно коммит, прошедший CI
# (workflow_run.head_sha); --only-latest не даёт устаревшему запуску откатить
# более новую версию. Вручную: вкладка Actions → Deploy → Run workflow
# (выложит, даже если код сервера не менялся).
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# выкладки идут строго по одной; новая ждёт, а не обрывает начатую
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Выкладка на сервер
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # именно проверенный CI коммит, а не случайно более новый main
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Ключ сервера
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          # Содержимое секретов в журнал не попадает: проверяем только «задан или нет».
          if [ -z "$KEY" ]; then
            echo "::error::Production deployment blocked: VPS_SSH_KEY is not configured"
            exit 1
          fi
          # Без сверки ключа хоста не выкладываем: ssh-keyscan принял бы
          # ключ любого, кто ответит по адресу, и root-ключ от сервера ушёл
          # бы туда же.
          if [ -z "$KNOWN" ]; then
            echo "::error::Production deployment blocked: VPS_KNOWN_HOSTS is not configured"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/tagmarkets_vps
          chmod 600 ~/.ssh/tagmarkets_vps
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
      - name: Выложить
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
        run: python3 tools/deploy_cli.py --yes --ref "$SHA" --only-latest $FORCE
      - name: Убрать ключ
        if: always()
        run: rm -f ~/.ssh/tagmarkets_vps
