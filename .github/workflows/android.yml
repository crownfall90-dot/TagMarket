# Приложение для Android: сборка на каждом изменении android/ и по кнопке.
# Два варианта: direct — APK для установки напрямую, он обновляется сам; play — AAB
# для Google Play Console. Подпись ключом загрузки — только если заданы секреты.
# После слияния в main подписанный APK и latest.json уходят в релиз android-latest:
# оттуда установленные приложения при входе узнают о новой версии и ставят её.
name: Android

on:
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write       # обновить релиз android-latest (только на main)

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка Android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    env:
      PLATFORMER_URL: ${{ vars.PLATFORMER_URL }}
      PLATFORMER_BOT: ${{ vars.PLATFORMER_BOT }}
      PLATFORMER_VERSION_NAME: 0.3.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Номер версии
        # 100 + номер запуска: всегда выше прежних сборок, в том числе собранных вручную (100)
        run: echo "PLATFORMER_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Ключ загрузки Google Play (если задан в секретах)
        env:
          KEYSTORE_B64: ${{ secrets.PLATFORMER_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "PLATFORMER_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi
      - name: APK (direct) и AAB для Google Play
        env:
          PLATFORMER_KEYSTORE_PASSWORD: ${{ secrets.PLATFORMER_KEYSTORE_PASSWORD }}
          PLATFORMER_KEY_ALIAS: ${{ secrets.PLATFORMER_KEY_ALIAS }}
          PLATFORMER_KEY_PASSWORD: ${{ secrets.PLATFORMER_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleDirectDebug :app:assembleDirectRelease :app:bundlePlayRelease
      - uses: actions/upload-artifact@v4
        with:
          name: platformer-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/direct/debug/app-direct-debug.apk
            android/app/build/outputs/apk/direct/release/*.apk
            android/app/build/outputs/bundle/playRelease/app-play-release.aab
          retention-days: 14
      - name: Обновление для установленных приложений (релиз android-latest)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=app/build/outputs/apk/direct/release/app-direct-release.apk
          if [ ! -f "$apk" ]; then
            # без ключа APK не подписан: поставить его поверх установленного нельзя
            echo "::warning::Ключ подписи не задан (PLATFORMER_KEYSTORE_*): обновление не опубликовано"
            exit 0
          fi
          name="platformer-$PLATFORMER_VERSION_CODE.apk"
          cp "$apk" "$RUNNER_TEMP/$name"
          sha=$(sha256sum "$RUNNER_TEMP/$name" | cut -d' ' -f1)
          size=$(stat -c%s "$RUNNER_TEMP/$name")
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/android-latest"
          printf '{"versionCode":%s,"versionName":"%s","apk":"%s/%s","sha256":"%s","size":%s}\n' \
            "$PLATFORMER_VERSION_CODE" "$PLATFORMER_VERSION_NAME" "$base" "$name" "$sha" "$size" > "$RUNNER_TEMP/latest.json"
          cat "$RUNNER_TEMP/latest.json"
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Platformer для Android" --notes "Последняя сборка APK. Приложение обновляется само при входе."
          # сначала APK, потом latest.json — приложение не увидит ссылку на ещё не загруженный файл
          gh release upload android-latest "$RUNNER_TEMP/$name" --clobber
          gh release upload android-latest "$RUNNER_TEMP/latest.json" --clobber
          gh release view android-latest --json assets --jq '.assets[].name' \
            | grep -E '^platformer-[0-9]+\.apk$' | grep -vx "$name" \
            | while read -r old; do gh release delete-asset android-latest "$old" --yes; done
