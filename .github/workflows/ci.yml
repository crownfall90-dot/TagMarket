# Проверки на каждый push и pull request: логика, API Mini App, синтаксис
# фронтенда, линтер и браузерный прогон интерфейса. Боевые данные, VPS и
# Telegram не затрагиваются — все тесты работают на временных базах.
name: CI

# push — только main (после него идёт деплой); ветки с открытым PR проверяет
# pull_request. Раньше на каждый push в ветку PR шли два одинаковых прогона.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Тесты · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.10 — нижняя граница (синтаксис X | Y), 3.13 — свежая версия
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Зависимости
        run: python -m pip install -r requirements.txt "ruff>=0.6"
      - name: Линтер
        run: ruff check .
      - name: Логика денег (selfcheck)
        run: python tests/selfcheck.py
      - name: API, права, аренда опроса
        run: python tests/test_miniapp.py
      - name: Синтаксис web/app.js
        run: node --check web/app.js
      - name: Статическая проверка web/ (стили, обработчики, id, версии файлов)
        run: python tests/static_check.py

  ui:
    # каждая ширина — на своей машине: вчетвером на одной (2 ядра) прогон шёл
    # ~10 минут, параллельно — как самая долгая ширина
    name: Интерфейс · ${{ matrix.width }} px
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        width: [320, 390, 768, 1280]
    env:
      TAGMARKETS_UI_SMOKE_WIDTHS: ${{ matrix.width }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Playwright
        id: pw
        run: |
          python -m pip install "playwright>=1.45"
          echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - name: Кэш Chromium
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # Системные библиотеки Chromium на ubuntu-latest уже стоят. --with-deps
      # тянул ещё шрифты и обновления apt с зеркала, которое порой отдаёт
      # 40 КБ/с: 11 минут из 12 уходили на это. Ставим только сам браузер
      # (headless shell — им тест и запускается); системные пакеты — лишь
      # если браузер без них не стартует.
      - name: Chromium
        run: |
          if [ "${{ steps.browsers.outputs.cache-hit }}" != "true" ]; then
            python -m playwright install --only-shell chromium
          fi
          python -c "from playwright.sync_api import sync_playwright as p; b=p().start().chromium.launch(); b.close()" \
            || python -m playwright install-deps chromium
      - name: Предпросмотр на ${{ matrix.width }} px
        run: python tests/ui_smoke.py
