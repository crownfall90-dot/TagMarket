# Проверки на каждый push и pull request: логика, API Mini App, синтаксис
# фронтенда, линтер и браузерный прогон интерфейса. Боевые данные, VPS и
# Telegram не затрагиваются — все тесты работают на временных базах.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Тесты · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.10 — нижняя граница (синтаксис X | Y), 3.13 — свежая версия
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Зависимости
        run: python -m pip install -r requirements.txt "ruff>=0.6"
      - name: Линтер
        run: ruff check .
      - name: Логика денег (selfcheck)
        run: python tests/selfcheck.py
      - name: API, права, аренда опроса
        run: python tests/test_miniapp.py
      - name: Синтаксис web/app.js
        run: node --check web/app.js

  ui:
    name: Интерфейс в браузере
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Playwright и Chromium
        run: |
          python -m pip install "playwright>=1.45"
          python -m playwright install --with-deps chromium
      - name: Предпросмотр на 320, 390, 768 и 1280 px
        run: python tests/ui_smoke.py
