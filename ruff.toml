# Линтер ловит только настоящие ошибки: неопределённые и неиспользуемые имена,
# синтаксис, изменяемые значения по умолчанию, замыкания на переменную цикла,
# «потерянные» asyncio-задачи. Стиль кода проекта (длина строк, кавычки,
# глобальное состояние в trades.py) намеренно не трогаем.
target-version = "py310"
extend-exclude = ["design"]

[lint]
select = [
    "F",        # pyflakes: неопределённые/неиспользуемые имена и импорты
    "E9",       # синтаксические ошибки
    "PLE",      # ошибки pylint (неверные аргументы, недостижимые конструкции)
    "B006",     # изменяемое значение по умолчанию
    "B008",     # вызов функции в значении по умолчанию
    "B012",     # return/break в finally глотает исключение
    "B017",     # assertRaises(Exception) — проверяет что угодно
    "B018",     # выражение без эффекта
    "B023",     # замыкание на переменную цикла
    "B025",     # повторяющийся except
    "B026",     # *args после именованного аргумента
    "B033",     # дубли в множестве
    "B035",     # статический ключ в dict comprehension
    "PLW0120",  # else у цикла без break
    "PLW0602",  # global без присваивания
    "PLW0711",  # except A or B
    "RUF006",   # asyncio.create_task без ссылки — задачу может собрать GC
]
